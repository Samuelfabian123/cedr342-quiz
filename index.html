const Q=[];let chN='',n=0;
D.split('\n').forEach(l=>{if(!l.includes('|')){chN=l;return}const p=l.split('|');Q.push({ch:chN,q:p[0],o:p.slice(1,5),a:'ABCD'.indexOf(K[n++])})});
const CH=[...new Set(Q.map(x=>x.ch))];
const app=document.getElementById('app');
let sel=new Set(CH),shuffle=true,run=null;
const L='ABCD';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let student=null;
try{student=JSON.parse(localStorage.getItem('cedr342-student')||'null')}catch(e){}
const LIMIT=70;
function login(msg){
 run=null;
 const s=student||{name:'',reg:''};
 app.innerHTML=`
 <div><div class="eyebrow">UNN · CEDR 342</div><h1>Entrepreneurship and Small Business</h1>
 <p class="sub">Exam practice. Sign in with your name and registration number to start.</p></div>
 <form class="panel" id="lf" novalidate>
  <label class="f" for="nm">Full name<input type="text" id="nm" autocomplete="name" value="${esc(s.name)}" placeholder="e.g. Chinedu Okafor"></label>
  <label class="f" for="rg">Registration number<input type="text" id="rg" inputmode="text" autocomplete="off" value="${esc(s.reg)}" placeholder="e.g. 2020/123456"></label>
  <p class="err" id="er" ${msg?'':'hidden'}>${msg||''}</p>
  <button class="btn" type="submit">Sign in</button>
 </form>
 <div class="panel"><b>Exam rules</b><ul class="rules"><li>70 random questions each attempt.</li><li>No answers show until you submit.</li><li>You can go back and change answers before submitting.</li><li>Your score and corrections show at the end.</li></ul></div>`;
 document.getElementById('lf').onsubmit=e=>{
  e.preventDefault();
  const name=document.getElementById('nm').value.trim().replace(/\s+/g,' '),reg=document.getElementById('rg').value.trim().toUpperCase();
  if(name.length<3)return login('Enter your full name.');
  if(!/\d{4,}/.test(reg)||reg.length<6)return login('Enter a valid registration number, for example 2020/123456.');
  student={name,reg};
  try{localStorage.setItem('cedr342-student',JSON.stringify(student))}catch(e){}
  home();
 };
}
function start(){
 const pool=Q.filter(x=>sel.has(x.ch));
 let items=shuf(pool).slice(0,LIMIT).map(x=>{let opts=x.o.map((t,i)=>({t,c:i===x.a}));if(shuffle)opts=shuf(opts);return{ch:x.ch,q:x.q,opts}});
 begin(items);
}
function begin(items){run={items,i:0,ans:items.map(()=>-1),warned:false};renderQ()}

function home(){
 run=null;
 const cnt=Math.min(LIMIT,Q.filter(x=>sel.has(x.ch)).length);
 app.innerHTML=`
 <div><div class="eyebrow">UNN · CEDR 342</div><h1>Exam practice</h1>
 <p class="sub">Each attempt is ${LIMIT} random questions from the ${Q.length} in the bank. Answers and score show only after you submit.</p></div>
 <p class="sub">Signed in: <b>${esc(student.name)}</b> · ${esc(student.reg)} · <button class="link" id="out">Change</button></p>
 <div class="panel">
  <div class="row" style="justify-content:space-between"><b>Chapters</b>
   <span><button class="link" id="all">Select all</button> · <button class="link" id="none">Clear</button></span></div>
  <div class="chips" id="chips">${CH.map(c=>`<button class="chip" aria-pressed="${sel.has(c)}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <label class="toggle"><input type="checkbox" id="sh" ${shuffle?'checked':''}> Shuffle options</label>
 </div>
 <button class="btn" id="go" ${cnt?'':'disabled'}>Start exam (${cnt} questions)</button>`;
 document.getElementById('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const c=b.dataset.c;sel.has(c)?sel.delete(c):sel.add(c);home()};
 document.getElementById('all').onclick=()=>{sel=new Set(CH);home()};
 document.getElementById('none').onclick=()=>{sel=new Set();home()};
 document.getElementById('sh').onchange=e=>{shuffle=e.target.checked};
 document.getElementById('go').onclick=start;
 document.getElementById('out').onclick=()=>login();
}

function renderQ(){
 const it=run.items[run.i],tot=run.items.length,last=run.i===tot-1,cur=run.ans[run.i];
 const left=run.ans.filter(x=>x<0).length;
 app.innerHTML=`
 <div class="top"><span>${esc(it.ch)}</span><span>${run.i+1} / ${tot}</span></div>
 <div class="bar"><i style="width:${(tot-left)/tot*100}%"></i></div>
 <div class="panel">
  <h2 class="q">${esc(it.q)}</h2>
  <div class="opts" id="opts">${it.opts.map((o,j)=>`<button class="opt${cur===j?' sel':''}" aria-pressed="${cur===j}" data-j="${j}"><b>${L[j]}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
  ${last&&run.warned&&left?`<p class="fb no">${left} question${left>1?'s':''} not answered. Tap Submit again to finish anyway.</p>`:''}
 </div>
 <div class="row"><button class="btn alt" id="prev" ${run.i?'':'disabled'}>Previous</button><button class="btn" id="next">${last?'Submit':'Next'}</button><button class="link" id="quit">Quit</button></div>
 <p class="sub" style="font-size:.9rem">${tot-left} of ${tot} answered. You can go back and change any answer before submitting.</p>`;
 document.getElementById('opts').onclick=e=>{const b=e.target.closest('.opt');if(b){run.ans[run.i]=+b.dataset.j;run.warned=false;renderQ()}};
 document.getElementById('prev').onclick=()=>{run.i--;renderQ()};
 document.getElementById('next').onclick=()=>{
  if(!last){run.i++;renderQ();return}
  if(left&&!run.warned){run.warned=true;renderQ();return}
  results();
 };
 document.getElementById('quit').onclick=home;
}

function results(){
 const r=run.items.map((it,k)=>({it,j:run.ans[k],ok:run.ans[k]>=0&&it.opts[run.ans[k]].c}));
 const tot=r.length,got=r.filter(x=>x.ok).length,pct=Math.round(got/tot*100);
 const by={};r.forEach(x=>{const b=by[x.it.ch]||(by[x.it.ch]={g:0,t:0});b.t++;if(x.ok)b.g++});
 const wrong=r.filter(x=>!x.ok);
 const msg=pct>=80?'Strong. Keep this up.':pct>=60?'Decent. Revise the missed ones below.':'Go through the summary again, then retry.';
 app.innerHTML=`
 <div><div class="eyebrow">Result · ${esc(student.name)} · ${esc(student.reg)}</div><div class="score">${got}/${tot}</div><p class="sub">${pct}%. ${msg}</p></div>
 <div class="panel"><b>By chapter</b><div class="scroll"><table><thead><tr><th>Chapter</th><th>Score</th></tr></thead><tbody>
 ${Object.keys(by).map(c=>`<tr><td>${esc(c)}</td><td>${by[c].g}/${by[c].t}</td></tr>`).join('')}</tbody></table></div></div>
 ${wrong.length?`<div class="panel"><b>Missed (${wrong.length})</b>${wrong.map(x=>{const c=x.it.opts.find(o=>o.c).t;return`<div class="wrong"><span>${esc(x.it.q)}</span><small>Your answer: ${x.j>=0?esc(x.it.opts[x.j].t):'none'}</small><b>Answer: ${esc(c)}</b></div>`}).join('')}</div>`:'<div class="panel"><b>No mistakes. Full marks.</b></div>'}
 <div class="row">${wrong.length?'<button class="btn" id="retry">Retry missed</button>':''}<button class="btn alt" id="again">New exam</button></div>`;
 const rt=document.getElementById('retry');
 if(rt)rt.onclick=()=>begin(shuf(wrong.map(x=>x.it)));
 document.getElementById('again').onclick=home;
 window.scrollTo(0,0);
}
student?home():login();
</script>

</body></html>
